name: 'regression_testing'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'regression_testing'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seeds-paths: ["seeds"]

vars:
  # Package-specific vars (defaults for regression_testing package)
  # The root project must define: prod_db, qa_db, prod_role, qa_role, dev_role
  regression_skip_clone: false
  regression_use_prod: false
  regression_full_ingest: false
  regression_schema_filter: ""

models:
  regression_testing:
    example:
      +materialized: view
